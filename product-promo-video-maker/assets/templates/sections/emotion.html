<!-- Emotion Curve -->
<section class="section" id="emotion">
  <div class="container">
    <h2>{{emotion.title}}</h2>
    <div class="curve-container">
      <svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
          </linearGradient>
        </defs>
        <!-- Grid -->
        <line x1="50" y1="250" x2="950" y2="250" stroke="#333" stroke-width="1"/>
        <line x1="50" y1="150" x2="950" y2="150" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
        <line x1="50" y1="50" x2="950" y2="50" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
        
        <!-- Curve -->
        <path d="M 50,200 Q 150,200 200,160 Q 250,120 350,80 Q 450,60 550,100 Q 650,140 750,70 Q 850,50 950,90" 
              fill="none" stroke="url(#curveGrad)" stroke-width="4"/>
        
        <!-- Points -->
        {{#each emotion.points}}
        <circle cx="{{x}}" cy="{{y}}" r="8" fill="{{color}}"/>
        {{/each}}
        
        <!-- Time Labels -->
        {{#each emotion.time_labels}}
        <text x="{{x}}" y="280" fill="#888" font-size="14">{{label}}</text>
        {{/each}}
        
        <!-- Phase Labels -->
        {{#each emotion.phase_labels}}
        <text x="{{x}}" y="30" fill="{{color}}" font-size="16">{{label}}</text>
        {{/each}}
        
        <!-- Shot Labels -->
        {{#each emotion.shot_labels}}
        <text x="{{x}}" y="235" fill="#555" font-size="11">{{label}}</text>
        {{/each}}
      </svg>
    </div>
  </div>
</section>
