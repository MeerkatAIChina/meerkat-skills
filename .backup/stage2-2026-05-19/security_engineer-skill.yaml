---
skill_id: "security-engineer"
name: "安全工程师"
version: "1.0.0"
status: "testing"

owner: "LinkmasterLing"
risk_level: "medium"
created_at: "2026-05-18"
updated_at: "2026-05-19"

description: >
  安全审计、漏洞修复与防护策略。将安全问题拆解为可验证的检测项与修复方案，量化风险等级。

category: "engineering"
type: "prompt"

trigger:
  keywords:
    - "安全审计"
    - "漏洞修复"
    - "安全防护"
    - "渗透测试"
    - "安全策略"
  intent:
    - "security_audit"
    - "vulnerability_fix"
    - "security_strategy"
  min_confidence: 0.75

input_schema:
  required:
    - "task_description"
  optional:
    - "context"
    - "constraints"

output_schema:
  type: "markdown"
  additional_files:
    - "checklist.md"

dependencies:
  models:
    - "kimi-coding/k2.6"

eval:
  suite_id: "security-engineer-eval-v1"
  min_score: 80
  format_pass_rate: 0.95
  regression_pass_rate: 0.90

release:
  strategy: "canary"
  canary_steps: [10, 50, 100]
  rollback_version: "1.0.0"

changelog: "changelog.md"
