name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  upload-to-oss:
    name: Upload to Alibaba Cloud OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare release files
        run: |
          mkdir -p release/skills
          cp -r skills/* release/skills/
          echo "=== Files to upload ==="
          find release -type f

      - name: Generate skill-positions.yaml
        run: |
          pip install pyyaml
          python .scripts/generate_skill_positions.py
          cp skill-positions.yaml release/
          echo "=== Generated skill-positions.yaml ==="
          cat release/skill-positions.yaml

      - name: Upload to Alibaba Cloud OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: meerkatai-skills
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:?}"
          OSSUTIL_URL="https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip"
          curl -fsSL -o /tmp/ossutil.zip "$OSSUTIL_URL"
          unzip -oj /tmp/ossutil.zip -d /tmp/ossutil
          chmod +x /tmp/ossutil/ossutil

          # Sync skills directory (deletes orphan files on OSS)
          /tmp/ossutil/ossutil sync -f -e "$OSS_ENDPOINT" release/skills/ "oss://${OSS_BUCKET}/skills/" --delete

          # Upload skill-positions.yaml
          /tmp/ossutil/ossutil cp -f -e "$OSS_ENDPOINT" release/skill-positions.yaml "oss://${OSS_BUCKET}/skill-positions.yaml"

          echo "=== OSS 下载地址 ==="
          echo "Skills directory: https://${OSS_BUCKET}.${OSS_ENDPOINT}/skills/"
          echo "Skill positions: https://${OSS_BUCKET}.${OSS_ENDPOINT}/skill-positions.yaml"
