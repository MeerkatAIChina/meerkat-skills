---
skill_id: "skillops-manager"
name: "SkillOps 管理器"
version: "1.0.0"
status: "production"

owner: "LinkmasterLing"
risk_level: "medium"
created_at: "2026-05-18"
updated_at: "2026-05-18"

description: >
  MeerkatAI Skill Registry 的元管理层 Skill，负责 Skill 的创建、校验、评测、发布和治理。
  它是 SkillOps 能力生产线的入口，让每个 Skill 的生命周期都有标准可循。

category: "operations"
type: "tool"

trigger:
