    - "创建 Skill"
    - "skillctl"
    - "校验 Skill"
    - "评测 Skill"
    - "发布 Skill"
    - "SkillOps"
    - "管理 Skill"
  intent:
    - "skill_lifecycle_management"
    - "skill_creation"
    - "skill_validation"
    - "skill_deployment"
  min_confidence: 0.75

input_schema:
  required:
    - action
  optional:
    - skill_id
    - skill_name
    - category
    - target_path

dependencies:
  tools:
    - "python3"
  skills:
    - "content-monetization-pipeline"

eval:
  suite_id: "skillops-manager-eval-v1"
  min_score: 85

release:
  strategy: "canary"
  canary_steps: [10, 50, 100]

changelog: "changelog.md"
