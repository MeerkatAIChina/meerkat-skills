---
skill_id: "skillops-manager"
name: "SkillOps 管理器"
version: "1.0.0"
status: "production"

owner: "LinkmasterLing"
risk_level: "medium"
created_at: "2026-05-18"
updated_at: "2026-05-19"

description: >
  MeerkatAI Skill Registry的元管理层Skill，负责Skill的创建、校验、评测、发布和治理。它是SkillOps能力生产线的入口。

category: "operations"
type: "tool"

trigger:
  keywords:
    - "新建Skill"
    - "创建Skill"
    - "skillctl"
    - "校验Skill"
    - "评测Skill"
    - "发布Skill"
    - "SkillOps"
  intent:
    - "skill_lifecycle_management"
    - "skill_creation"
    - "skill_validation"
  min_confidence: 0.75

input_schema:
  required:
    - "action"
  optional:
    - "parameters"
    - "target_path"

output_schema:
  type: "json"
  additional_files:
    - "log.txt"

dependencies:
  models:
    - "kimi-coding/k2.6"
  tools:
    - "python3"

eval:
  suite_id: "skillops-manager-eval-v1"
  min_score: 80
  format_pass_rate: 0.95
  regression_pass_rate: 0.90

release:
  strategy: "canary"
  canary_steps: [10, 50, 100]
  rollback_version: "1.0.0"

changelog: "changelog.md"
