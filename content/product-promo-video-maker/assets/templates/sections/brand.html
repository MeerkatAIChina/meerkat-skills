<!-- Brand -->
<section class="section" id="brand">
  <div class="container">
    {{#if brand.hero_image}}
    <div class="brand-hero-image">
      <img src="{{brand.hero_image}}" alt="{{product.name}}" />
    </div>
    {{/if}}
    <div class="logo">{{brand.logo_text}}</div>
    <div class="cta">{{brand.cta_text}}</div>
    <a href="#" class="btn">{{brand.button_text}}</a>
  </div>
</section>
